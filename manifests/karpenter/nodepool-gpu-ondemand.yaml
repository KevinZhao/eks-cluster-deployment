apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-ondemand
spec:
  template:
    metadata:
      labels:
        workload-type: gpu
        purchase-option: on-demand
        gpu-cluster: shared  # Common label for unified scheduling
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - p5.48xlarge
            - p5en.48xlarge
            - p6-b200.48xlarge
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-p5
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
  limits:
    cpu: "768"   # 4 nodes * 192 vCPU
    memory: 8000Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
    budgets:
      - nodes: "0"  # Prevent automatic disruption (GPU workloads are expensive)
