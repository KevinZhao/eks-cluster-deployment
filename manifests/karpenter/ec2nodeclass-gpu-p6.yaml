apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-p6
spec:
  # AMI Selection - EKS-optimized AL2023 AMI (auto-selects GPU variant)
  amiSelectorTerms:
    - alias: al2023@latest

  # Block Device Mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda  # Root volume
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
    - deviceName: /dev/xvdb  # Data volume for LVM
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

  # User Data - LVM setup with idempotency (EFA setup handled by DaemonSet)
  userData: |
    #!/bin/bash
    set -ex

    echo "=== GPU Node Initialization ==="

    # LVM Configuration for containerd
    echo "=== Setting up LVM for containerd ==="

    # Check if already configured
    if mountpoint -q /var/lib/containerd && [ -e /dev/vg_data/lv_containerd ]; then
      echo "LVM already configured and mounted, skipping setup"
      systemctl start containerd || true
      exit 0
    fi

    systemctl stop containerd || true

    # Detect 100GB gp3 data disk (exclude instance store NVMe)
    # Look for ~100GB disk that's not mounted and not the root disk
    DATA_DISK=""
    for disk in $(lsblk -d -o NAME,TYPE -n | awk '$2=="disk" {print $1}'); do
      # Skip root disk
      [[ "$disk" == "xvda" || "$disk" == "nvme0n1" ]] && continue

      # Get size in GB
      SIZE_GB=$(lsblk -d -o NAME,SIZE -n /dev/$disk 2>/dev/null | awk '{gsub(/G/,"",$2); print int($2)}')

      # Look for ~100GB disk (90-110GB range to account for formatting)
      if [[ "$SIZE_GB" -ge 90 && "$SIZE_GB" -le 110 ]]; then
        # Check if not mounted
        if ! mountpoint -q /dev/$disk 2>/dev/null && ! lsblk /dev/$disk -o MOUNTPOINT -n | grep -q "/"; then
          DATA_DISK="/dev/$disk"
          echo "Found 100GB data disk: $DATA_DISK"
          break
        fi
      fi
    done

    if [ -z "$DATA_DISK" ]; then
      echo "No 100GB data disk found, skipping LVM setup"
      systemctl start containerd
      exit 0
    fi

    # Install LVM tools
    dnf install -y lvm2

    # Create LVM structure with idempotency checks
    if ! pvs "$DATA_DISK" &>/dev/null; then
      echo "Creating physical volume on $DATA_DISK"
      pvcreate "$DATA_DISK"
    else
      echo "Physical volume already exists on $DATA_DISK"
    fi

    if ! vgs vg_data &>/dev/null; then
      echo "Creating volume group vg_data"
      vgcreate vg_data "$DATA_DISK"
    else
      echo "Volume group vg_data already exists"
    fi

    if ! lvs vg_data/lv_containerd &>/dev/null; then
      echo "Creating logical volume lv_containerd"
      lvcreate -l 100%FREE -n lv_containerd vg_data
    else
      echo "Logical volume lv_containerd already exists"
    fi

    # Format as XFS only if not already formatted
    if ! blkid /dev/vg_data/lv_containerd | grep -q xfs; then
      echo "Formatting as XFS"
      mkfs.xfs /dev/vg_data/lv_containerd
    else
      echo "XFS filesystem already exists"
    fi

    # Backup existing containerd data if not already backed up
    if [ -d /var/lib/containerd ] && [ "$(ls -A /var/lib/containerd 2>/dev/null)" ] && ! mountpoint -q /var/lib/containerd; then
      echo "Backing up existing containerd data"
      mv /var/lib/containerd /var/lib/containerd.bak
    fi

    # Mount volume if not already mounted
    mkdir -p /var/lib/containerd
    if ! mountpoint -q /var/lib/containerd; then
      echo "Mounting LVM volume"
      mount /dev/vg_data/lv_containerd /var/lib/containerd
    else
      echo "Volume already mounted"
    fi

    # Restore data if backup exists
    if [ -d /var/lib/containerd.bak ]; then
      echo "Restoring containerd data"
      cp -a /var/lib/containerd.bak/* /var/lib/containerd/ 2>/dev/null || true
      rm -rf /var/lib/containerd.bak
    fi

    # Add to fstab only if not already present
    if ! grep -q "/dev/vg_data/lv_containerd" /etc/fstab; then
      echo "Adding to /etc/fstab"
      echo "/dev/vg_data/lv_containerd /var/lib/containerd xfs defaults,nofail 0 2" >> /etc/fstab
    else
      echo "fstab entry already exists"
    fi

    # Start containerd
    systemctl start containerd

    echo "=== LVM setup complete ==="
    echo "=== Node initialization complete ==="
  # Metadata Options (IMDSv2)
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  # Security Groups
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}

  # Subnets
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}

  # IAM Instance Profile (reuse existing node profile)
  instanceProfile: KarpenterNodeRole-${CLUSTER_NAME}

  # Tags
  tags:
    Name: ${CLUSTER_NAME}-gpu-node
    karpenter.sh/discovery: ${CLUSTER_NAME}
    node-type: gpu
    gpu-family: p6
