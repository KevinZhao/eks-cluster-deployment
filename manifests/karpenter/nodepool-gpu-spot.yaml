apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
spec:
  template:
    metadata:
      labels:
        workload-type: gpu
        purchase-option: spot
        gpu-cluster: shared
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - p5.48xlarge
            - p5en.48xlarge
            - p6-b200.48xlarge
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-p5
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
        - key: karpenter.sh/spot
          effect: PreferNoSchedule  # Soft taint - allows fallback
  limits:
    cpu: "768"   # 4 nodes * 192 vCPU
    memory: 8000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
