apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-capacity-block
spec:
  template:
    metadata:
      labels:
        workload-type: gpu
        purchase-option: capacity-block
        gpu-cluster: shared
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]  # Capacity Block uses on-demand type
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - p5.48xlarge
            - p5en.48xlarge
            - p6-b200.48xlarge
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-cb  # References Capacity Block class with reservation
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
  limits:
    cpu: "384"   # Match pre-purchased capacity (2 nodes * 192 vCPU)
    memory: 4000Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 120m  # Very conservative (time-bound reservation)
    budgets:
      - nodes: "0"  # Prevent automatic disruption
