apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: cpu-base  # Will be overridden by overlay
spec:
  # AMI Selection - Will be overridden by overlay
  amiFamily: AL2023
  amiSelectorTerms:
    - name: "amazon-eks-node-al2023-ARCH-standard-${K8S_VERSION}-*"  # ARCH replaced by overlay

  # IAM Role
  role: "KarpenterNodeRole-${CLUSTER_NAME}"

  # Subnet Selector
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  # Security Group Selector
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  # Block Device Mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

    - deviceName: /dev/xvdb
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

  # User Data - LVM setup for containerd data volume
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="==BOUNDARY=="

    --==BOUNDARY==
    Content-Type: text/cloud-boothook; charset="us-ascii"

    #!/bin/bash
    # Mount data disk to /var/lib/containerd using LVM
    set -euxo pipefail

    # Stop containerd first
    systemctl stop containerd || true

    # Find unpartitioned data disk (more reliable than excluding root)
    DISK=""
    for dev in $(lsblk -dpno NAME | grep nvme); do
      PARTS=$(lsblk -no NAME "$dev" 2>/dev/null | wc -l)
      if [ "$PARTS" -eq 1 ]; then
        DISK="$dev"
        echo "Found unpartitioned data disk: $DISK"
        break
      fi
    done

    if [ -z "$DISK" ]; then
      echo "No data disk found, skip LVM setup"
      systemctl start containerd
      exit 0
    fi

    # Check if LVM already configured
    if vgs vg_data &>/dev/null; then
      echo "LVM already configured"
    else
      # Install lvm2 (not installed by default on AL2023)
      dnf install -y lvm2

      # Create LVM
      pvcreate "$DISK"
      vgcreate vg_data "$DISK"
      lvcreate -l 100%VG -n lv_containerd vg_data
      mkfs.xfs /dev/vg_data/lv_containerd
    fi

    # Mount LV to temporary directory and migrate data
    TEMP_MOUNT="/mnt/runtime/containerd"
    mkdir -p "$TEMP_MOUNT"

    echo "Mounting LV to temporary directory: $TEMP_MOUNT"
    mount /dev/vg_data/lv_containerd "$TEMP_MOUNT"

    echo "Copying containerd data (including cached images) from AMI..."
    cp -a /var/lib/containerd/. "$TEMP_MOUNT/"

    echo "Unmounting temporary directory"
    umount "$TEMP_MOUNT"

    echo "Mounting LV to final destination: /var/lib/containerd"
    mount /dev/vg_data/lv_containerd /var/lib/containerd

    # Add to fstab for persistence
    grep -q "lv_containerd" /etc/fstab || \
      echo "/dev/vg_data/lv_containerd /var/lib/containerd xfs defaults,nofail 0 2" >> /etc/fstab

    echo "Containerd data migration completed"
    df -h /var/lib/containerd

    # Start containerd with migrated data
    systemctl start containerd

    --==BOUNDARY==--

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  # Tags - will be extended by overlays
  tags:
    karpenter.sh/discovery: "${CLUSTER_NAME}"
    Environment: production
    ManagedBy: karpenter
    business: middleware
    resource: eks
