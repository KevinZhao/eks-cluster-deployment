apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-odcr
spec:
  template:
    metadata:
      labels:
        workload-type: gpu
        purchase-option: odcr
        gpu-cluster: shared
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]  # ODCR uses on-demand billing
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - p5.48xlarge
            - p5en.48xlarge
            - p6-b200.48xlarge
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-odcr  # References ODCR-specific class with capacity reservation
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
  limits:
    cpu: "384"   # Limit based on pre-purchased capacity (2 nodes * 192 vCPU)
    memory: 4000Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60m  # Conservative for reserved capacity
    budgets:
      - nodes: "0"  # Prevent automatic disruption
