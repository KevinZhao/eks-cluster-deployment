---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fsx-csi-controller-sa
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-fsx-csi-driver
  annotations:
    eks.amazonaws.com/sts-regional-endpoints: "true"

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: fsx-csi-external-provisioner-role
  labels:
    app.kubernetes.io/name: aws-fsx-csi-driver
rules:
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list", "watch", "create", "update", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["csinodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "watch", "list", "delete", "update", "create"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: fsx-csi-external-provisioner-binding
  labels:
    app.kubernetes.io/name: aws-fsx-csi-driver
subjects:
- kind: ServiceAccount
  name: fsx-csi-controller-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: fsx-csi-external-provisioner-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fsx-csi-controller-pdb
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-fsx-csi-driver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fsx-csi-controller

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: fsx-csi-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-fsx-csi-driver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fsx-csi-controller
      app.kubernetes.io/name: aws-fsx-csi-driver
  template:
    metadata:
      labels:
        app: fsx-csi-controller
        app.kubernetes.io/name: aws-fsx-csi-driver
    spec:
      serviceAccountName: fsx-csi-controller-sa
      priorityClassName: system-cluster-critical
      nodeSelector:
        ${SYSTEM_NODE_LABEL_KEY}: ${SYSTEM_NODE_LABEL_VALUE}
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: fsx-csi-controller
            topologyKey: kubernetes.io/hostname
      containers:
      - name: fsx-plugin
        image: public.ecr.aws/fsx-csi-driver/aws-fsx-csi-driver:v1.7.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args:
        - --endpoint=$(CSI_ENDPOINT)
        - --logtostderr
        - --v=5
        env:
        - name: CSI_ENDPOINT
          value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
        - name: AWS_REGION
          value: ${AWS_REGION}
        volumeMounts:
        - name: socket-dir
          mountPath: /var/lib/csi/sockets/pluginproxy/
        ports:
        - name: healthz
          containerPort: 9808
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 10
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 10m
            memory: 40Mi
          limits:
            cpu: 200m
            memory: 256Mi
      - name: csi-provisioner
        image: public.ecr.aws/csi-components/csi-provisioner:v5.3.0-eksbuild.5
        imagePullPolicy: IfNotPresent
        args:
        - --csi-address=$(ADDRESS)
        - --timeout=5m
        - --extra-create-metadata
        - --leader-election=true
        - --default-fstype=lustre
        - --v=5
        env:
        - name: ADDRESS
          value: /var/lib/csi/sockets/pluginproxy/csi.sock
        volumeMounts:
        - name: socket-dir
          mountPath: /var/lib/csi/sockets/pluginproxy/
        resources:
          requests:
            cpu: 10m
            memory: 40Mi
          limits:
            cpu: 200m
            memory: 256Mi
      - name: liveness-probe
        image: public.ecr.aws/csi-components/livenessprobe:v2.17.0-eksbuild.2
        imagePullPolicy: IfNotPresent
        args:
        - --csi-address=/csi/csi.sock
        - --health-port=9808
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: socket-dir
        emptyDir: {}

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fsx-csi-node
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-fsx-csi-driver
    app: fsx-csi-node
spec:
  selector:
    matchLabels:
      app: fsx-csi-node
  template:
    metadata:
      labels:
        app: fsx-csi-node
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      hostNetwork: true
      dnsPolicy: ClusterFirst
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: fsx-plugin
          image: public.ecr.aws/fsx-csi-driver/aws-fsx-csi-driver:v1.7.0
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --logtostderr
            - --v=5
          env:
            - name: CSI_ENDPOINT
              value: unix:/csi/csi.sock
          securityContext:
            privileged: true
          volumeMounts:
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: plugin-dir
              mountPath: /csi
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              cpu: 100m
              memory: 256Mi
        - name: csi-driver-registrar
          image: public.ecr.aws/csi-components/csi-node-driver-registrar:v2.15.0-eksbuild.2
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --v=5
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/fsx.csi.aws.com/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 128Mi
        - name: liveness-probe
          image: public.ecr.aws/csi-components/livenessprobe:v2.17.0-eksbuild.2
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9810
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/fsx.csi.aws.com/
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory

---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: fsx.csi.aws.com
  labels:
    app.kubernetes.io/name: aws-fsx-csi-driver
spec:
  attachRequired: false
  podInfoOnMount: false
